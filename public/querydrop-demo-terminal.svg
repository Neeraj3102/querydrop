<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 340" width="100%" height="auto">
  <defs>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.6" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.25" />
    </filter>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    
    @keyframes typingQuery {
      0% { width: 0ch; }
      30% { width: 44ch; }
      85% { width: 44ch; }
      100% { width: 44ch; }
    }
    
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
    
    @keyframes showOutput {
      0%, 35% { opacity: 0; transform: translateY(4px); }
      45%, 90% { opacity: 1; transform: translateY(0); }
      100% { opacity: 1; }
    }
    
    @keyframes pulseSuccess {
      0%, 38% { opacity: 0; }
      42%, 92% { opacity: 1; }
      100% { opacity: 1; }
    }

    .typed-text {
      display: inline-block;
      overflow: hidden;
      white-space: nowrap;
      animation: typingQuery 8s steps(44, end) infinite;
    }

    .cursor {
      animation: blink 0.9s infinite;
    }

    .output-section {
      animation: showOutput 8s ease-in-out infinite;
    }

    .status-pill {
      animation: pulseSuccess 8s ease-in-out infinite;
    }
  </style>

  <!-- Container Box with glow border -->
  <rect x="10" y="10" width="800" height="320" rx="12" fill="#090d16" stroke="url(#borderGrad)" stroke-width="1.5" filter="url(#glow)" />

  <!-- Terminal Top Bar -->
  <rect x="10" y="10" width="800" height="38" rx="12" fill="url(#headerGrad)" />
  <rect x="10" y="44" width="800" height="4" fill="#0f172a" />
  
  <!-- Window Control Buttons -->
  <circle cx="32" cy="29" r="6" fill="#ef4444" />
  <circle cx="52" cy="29" r="6" fill="#f59e0b" />
  <circle cx="72" cy="29" r="6" fill="#10b981" />

  <!-- Title / Tab -->
  <text x="410" y="33" text-anchor="middle" fill="#94a3b8" font-size="12" class="mono" font-weight="600">querydrop — worker@sqlite-wasm: memory/telemetry.db</text>
  
  <!-- Status Badge -->
  <g class="status-pill">
    <rect x="670" y="20" width="125" height="18" rx="9" fill="#065f46" fill-opacity="0.6" stroke="#10b981" stroke-width="1"/>
    <circle cx="682" cy="29" r="3.5" fill="#34d399" />
    <text x="693" y="32" fill="#a7f3d0" font-size="10" class="mono" font-weight="bold">ACTIVE (12ms)</text>
  </g>

  <!-- Terminal Body -->
  <g transform="translate(30, 75)">
    <!-- Prompt Line -->
    <text x="0" y="0" fill="#38bdf8" font-size="13" class="mono" font-weight="bold">sqlite&gt;</text>
    
    <!-- Animated Typing SQL Query -->
    <g transform="translate(70, -12)">
      <foreignObject width="700" height="30">
        <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: ui-monospace, monospace; font-size: 13px; color: #f8fafc; font-weight: 500;">
          <span class="typed-text">SELECT geo_city, count(*), avg(duration_ms)</span><span class="cursor" style="color: #38bdf8; font-weight: bold;">|</span>
        </div>
      </foreignObject>
    </g>

    <text x="70" y="18" fill="#64748b" font-size="12" class="mono">   ... FROM telemetry GROUP BY geo_city ORDER BY 2 DESC LIMIT 4;</text>

    <!-- Query Output Animation -->
    <g class="output-section" transform="translate(0, 48)">
      <!-- Divider -->
      <line x1="0" y1="0" x2="760" y2="0" stroke="#1e293b" stroke-width="1" />
      
      <!-- Table Header -->
      <text x="0" y="22" fill="#38bdf8" font-size="12" class="mono" font-weight="bold">┌────────────────────────┬──────────────┬──────────────────┐</text>
      <text x="0" y="40" fill="#38bdf8" font-size="12" class="mono" font-weight="bold">│ GEO_CITY               │ RECORD_COUNT │ AVG_LATENCY (MS) │</text>
      <text x="0" y="58" fill="#38bdf8" font-size="12" class="mono" font-weight="bold">├────────────────────────┼──────────────┼──────────────────┤</text>

      <!-- Table Rows -->
      <text x="0" y="78" fill="#e2e8f0" font-size="12" class="mono">│ Tokyo 東京 🇯🇵           │ 31,250       │ 14.82 ms         │</text>
      <text x="0" y="98" fill="#e2e8f0" font-size="12" class="mono">│ São Paulo 🇧🇷           │ 31,250       │ 16.14 ms         │</text>
      <text x="0" y="118" fill="#e2e8f0" font-size="12" class="mono">│ München, Bayern 🇩🇪      │ 31,250       │ 11.23 ms         │</text>
      <text x="0" y="138" fill="#e2e8f0" font-size="12" class="mono">│ San Francisco, CA 🇺🇸    │ 31,250       │ 13.91 ms         │</text>
      <text x="0" y="156" fill="#38bdf8" font-size="12" class="mono" font-weight="bold">└────────────────────────┴──────────────┴──────────────────┘</text>
      
      <!-- Execution Footer -->
      <text x="0" y="182" fill="#10b981" font-size="11" class="mono">✓ 4 rows in set (executed in 0.012 sec on Web Worker thread)</text>
    </g>
  </g>
</svg>
